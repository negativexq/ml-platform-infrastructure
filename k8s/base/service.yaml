apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: ml-platform
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/part-of: ml-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: inference
  ports:
    - name: http
      port: 80
      targetPort: http
      # Mapped to localhost:30080 by k8s/kind-cluster.yaml.
      nodePort: 30080
