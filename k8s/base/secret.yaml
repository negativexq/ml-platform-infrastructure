apiVersion: v1
kind: Secret
metadata:
  name: inference-artifact-store
  namespace: ml-platform
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/part-of: ml-platform
type: Opaque
stringData:
  # Local-lab MinIO credentials only. Real credentials never live in Git —
  # M6 replaces this with an IAM role assumed through the ServiceAccount.
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
