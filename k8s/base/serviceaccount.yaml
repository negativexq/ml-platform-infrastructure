apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference
  namespace: ml-platform
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/part-of: ml-platform
# No API access is needed by the workload; this identity exists so M6 can map
# it onto an IAM role (IRSA) instead of introducing one at migration time.
automountServiceAccountToken: false
