# Throwaway pod for backing up / restoring MinIO contents.
#
#   initContainer mirror-out : mirrors the live bucket into a shared emptyDir
#                              (so a fresh pod is immediately ready to back up)
#   container     cp         : busybox — ships tar, so `kubectl cp` works
#   container     mc         : minio/mc — mirrors the staging dir back to the
#                              bucket on restore
apiVersion: v1
kind: Pod
metadata:
  name: minio-shell
  namespace: ml-platform
  labels:
    app.kubernetes.io/name: minio-shell
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: art
      emptyDir: {}
  initContainers:
    - name: mirror-out
      image: minio/mc:RELEASE.2024-09-16T17-43-14Z
      env:
        - { name: HOME, value: /tmp }
      command:
        - /bin/sh
        - -c
        - |
          mc alias set l http://platform-minio:9000 minioadmin minioadmin >/dev/null
          mc mirror --quiet l/mlflow-artifacts /art || true
      volumeMounts:
        - { name: art, mountPath: /art }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
  containers:
    - name: cp
      image: busybox:1.36
      command: ["sh", "-c", "sleep 1800"]
      volumeMounts:
        - { name: art, mountPath: /art }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
    - name: mc
      image: minio/mc:RELEASE.2024-09-16T17-43-14Z
      env:
        - { name: HOME, value: /tmp }
      command: ["sh", "-c", "sleep 1800"]
      volumeMounts:
        - { name: art, mountPath: /art }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
