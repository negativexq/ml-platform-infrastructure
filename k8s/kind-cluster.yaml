kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ml-platform

# Local image cache policy; keep in sync with kind-storage-policy.json.
# kubeadm applies this KubeletConfiguration to all nodes.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    imageGCHighThresholdPercent: 80
    imageGCLowThresholdPercent: 70
    imageMinimumGCAge: 2m
    imageMaximumGCAge: 6h
    containerLogMaxSize: 10Mi
    containerLogMaxFiles: 3

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # inference Service
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # MLflow tracking server (UI + training from the host)
      - containerPort: 30500
        hostPort: 30500
        protocol: TCP
      # Grafana
      - containerPort: 30300
        hostPort: 30300
        protocol: TCP
  - role: worker
  - role: worker
