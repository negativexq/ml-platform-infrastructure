kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ml-platform

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # NodePort 30080 → localhost:30080, so the Service is reachable from the
      # host without kubectl port-forward.
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
