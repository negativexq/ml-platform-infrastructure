apiVersion: v1
kind: Secret
metadata:
  name: platform-minio
  labels:
    {{- include "platform-local.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.minio.auth.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.auth.rootPassword | quote }}
  # Consumed by MLflow and the inference app as AWS-style credentials.
  AWS_ACCESS_KEY_ID: {{ .Values.minio.auth.rootUser | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.minio.auth.rootPassword | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-minio
  labels:
    {{- include "platform-local.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
{{- if .Values.minio.persistence.enabled }}
apiVersion: apps/v1
kind: StatefulSet
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: platform-minio
  labels:
    {{- include "platform-local.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  {{- if .Values.minio.persistence.enabled }}
  serviceName: platform-minio
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if not .Values.minio.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "platform-local.labels" . | nindent 8 }}
        app.kubernetes.io/name: minio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: platform-minio
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not .Values.minio.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.minio.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-minio-createbucket
  labels:
    {{- include "platform-local.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio-createbucket
  annotations:
    # Re-run on every helm upgrade; creating an existing bucket is a no-op.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        {{- include "platform-local.labels" . | nindent 8 }}
        app.kubernetes.io/name: minio-createbucket
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: mc-home
          emptyDir: {}
      containers:
        - name: mc
          image: {{ .Values.minio.mcImage }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://platform-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio..."; sleep 3
              done
              mc mb --ignore-existing local/{{ .Values.minio.bucket }}
              mc version enable local/{{ .Values.minio.bucket }} || true
              echo "bucket {{ .Values.minio.bucket }} ready"
          env:
            # mc writes its config under $HOME; the container's default home
            # is not writable for a non-root uid.
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: platform-minio
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mc-home
              mountPath: /tmp
