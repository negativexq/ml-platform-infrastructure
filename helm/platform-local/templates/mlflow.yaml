apiVersion: v1
kind: Service
metadata:
  name: platform-mlflow
  labels:
    {{- include "platform-local.labels" . | nindent 4 }}
    app.kubernetes.io/name: mlflow
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: {{ .Values.mlflow.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-mlflow
  labels:
    {{- include "platform-local.labels" . | nindent 4 }}
    app.kubernetes.io/name: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "platform-local.labels" . | nindent 8 }}
        app.kubernetes.io/name: mlflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # Wait for Postgres, then run the schema migration explicitly. The
      # tracking server only auto-migrates an empty DB on a cold start; if the
      # database is replaced under a running pod (an M8 restore, a wiped PVC)
      # the server never notices. Running `mlflow db upgrade` here — idempotent
      # — makes every pod start leave the schema correct.
      initContainers:
        - name: db-migrate
          image: {{ .Values.mlflow.image }}
          imagePullPolicy: {{ .Values.mlflow.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              until python -c "import socket; socket.create_connection(('platform-postgres', 5432), 5)" 2>/dev/null; do
                echo "waiting for postgres..."; sleep 3
              done
              mlflow db upgrade "{{ include "platform-local.postgresUri" . }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: mlflow
          image: {{ .Values.mlflow.image }}
          imagePullPolicy: {{ .Values.mlflow.imagePullPolicy }}
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            # One gunicorn worker: the default of four multiplies the server's
            # already-large footprint. One is plenty for local traffic.
            - --workers=1
            - --backend-store-uri={{ include "platform-local.postgresUri" . }}
            - --default-artifact-root=s3://{{ .Values.minio.bucket }}/
            - --allowed-hosts={{ join "," .Values.mlflow.allowedHosts }}
          env:
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://platform-minio:9000
          envFrom:
            - secretRef:
                name: platform-minio
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.mlflow.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
