# platform-local — PostgreSQL + MinIO + MLflow for the kind cluster.
#
# postgres and minio run as StatefulSets with PVCs (M8). Their data survives
# pod deletion; the backup/restore drill covers volume loss.

nameOverride: ""
commonLabels: {}

# M9: kindnet enforces standard NetworkPolicy (docs/evidence/m7). These lock
# the namespace to a default-deny with explicit allows.
networkPolicy:
  enabled: true
  monitoringNamespace: observability

# ---------------------------------------------------------------------------
postgres:
  image: postgres:16-alpine
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: standard
  auth:
    username: mlflow
    password: mlflow
    database: mlflow
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------
minio:
  image: minio/minio:RELEASE.2024-09-13T20-26-02Z
  mcImage: minio/mc:RELEASE.2024-09-16T17-43-14Z
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
  bucket: mlflow-artifacts
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# ---------------------------------------------------------------------------
mlflow:
  image: ml-platform-mlflow:local
  imagePullPolicy: IfNotPresent
  # MLflow 3.x re-introduced Host-header (DNS-rebinding) protection. Every name
  # a client may use to reach the server has to be listed.
  allowedHosts:
    - platform-mlflow
    - platform-mlflow:5000
    - platform-mlflow.ml-platform.svc.cluster.local
    - platform-mlflow.ml-platform.svc.cluster.local:5000
    - localhost
    - localhost:5000
    - localhost:30500
    - 127.0.0.1
    - 127.0.0.1:5000
    - 127.0.0.1:30500
  resources:
    requests:
      cpu: 100m
      # MLflow 3.15 (first release with all 7 CVE fixes) has a ~1.4 GiB memory
      # floor from its bundled job/genai subsystem. Earlier, lighter versions
      # ship known CRITICAL path-traversal and command-execution bugs, so the
      # memory cost is accepted. See docs/evidence/m9/gate.md.
      memory: 512Mi
    limits:
      memory: 1792Mi
  # Exposed on the host via kind's extraPortMappings, for `mlflow ui` and for
  # running training from a laptop against the in-cluster server.
  nodePort: 30500
