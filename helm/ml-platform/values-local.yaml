# Local kind environment.
#
# Every platform dependency runs inside the cluster (helm/platform-local):
# MLflow, MinIO and PostgreSQL. Nothing here points at the host.

environment: local

image:
  repository: ml-platform-inference
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: NodePort
  nodePort: 30080

model:
  uri: "models:/ml-platform-model/1"

mlflow:
  trackingUri: "http://platform-mlflow.ml-platform.svc.cluster.local:5000"
  s3EndpointUrl: "http://platform-minio.ml-platform.svc.cluster.local:9000"

# Nothing off-cluster to reach.
hostAliases: []

artifactStore:
  # Reference the platform-minio Secret that helm/platform-local renders
  # rather than duplicating the credentials here.
  mode: existing
  existingSecret: platform-minio

logging:
  level: INFO
  json: true

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
