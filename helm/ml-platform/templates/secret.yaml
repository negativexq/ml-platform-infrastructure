{{- if eq .Values.artifactStore.mode "local" }}
{{- /*
  Lab-only convenience: renders MinIO credentials from values. Real
  environments use mode "existing" (a Secret managed outside the chart) or
  mode "irsa" (no Secret at all — the ServiceAccount carries the identity).
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ml-platform.artifactSecretName" . }}
  labels:
    {{- include "ml-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "artifactStore.accessKeyId is required when mode is 'local'" .Values.artifactStore.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "artifactStore.secretAccessKey is required when mode is 'local'" .Values.artifactStore.secretAccessKey | quote }}
{{- end }}
