{{- if and (not .Values.reconciler.leaderElection) (ne (int .Values.reconciler.replicas) 1) }}
{{- fail "reconciler.replicas must be 1 when leader election is disabled" }}
{{- end }}
{{- $name := include "controlplane.name" . }}
{{- range $component := list "api" "gateway" "reconciler" }}
{{- $settings := index $.Values $component }}
{{- $go := and (eq $component "gateway") (eq ($settings.runtime | default "go") "go") }}
{{- if and (eq $component "gateway") (not (has ($settings.runtime | default "go") (list "go" "python"))) }}{{ fail "gateway.runtime must be go or python" }}{{ end }}
{{- if and $go (ne ($settings.observabilityProfile | default "normal") "normal") }}{{ fail "Go gateway requires the normal observability profile" }}{{ end }}
{{- $port := ternary 8081 8080 (eq $component "gateway") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $component }}
spec:
  replicas: {{ $settings.replicas }}
  {{- if and (eq $component "reconciler") (not $.Values.reconciler.leaderElection) }}
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: mlp-controlplane-{{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/name: mlp-controlplane-{{ $component }}
        app.kubernetes.io/part-of: ml-platform
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- if and (or (ne $component "reconciler") $.Values.reconciler.leaderElection) (gt (int $settings.replicas) 1) }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/name: mlp-controlplane-{{ $component }}
      {{- end }}
      serviceAccountName: {{ $name }}-{{ $component }}
      securityContext:
        {{- include "controlplane.podSecurity" $ | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          {{- if $go }}
          image: {{ if $settings.image.digest }}{{ printf "%s@%s" $settings.image.repository $settings.image.digest | quote }}{{ else }}{{ printf "%s:%s" $settings.image.repository $settings.image.tag | quote }}{{ end }}
          imagePullPolicy: {{ $settings.image.pullPolicy }}
          {{- else }}
          image: {{ include "controlplane.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- end }}
          {{- if eq $component "reconciler" }}
          command: [python, -m, controlplane.reconciler_main]
          {{- else }}
          # EndpointSlice and proxy updates are asynchronous. Keep serving during
          # removal from Service endpoints before uvicorn receives SIGTERM.
          lifecycle:
            preStop:
              exec:
                {{- if $go }}
                command: [/mlp-gateway-go, "--drain-wait=10s"]
                {{- else }}
                command: [python, -c, "import time; time.sleep(10)"]
                {{- end }}
          {{- if $go }}
          command: [/mlp-gateway-go]
          {{- else }}
          command:
            - uvicorn
            - {{ ternary "controlplane.gateway_main:app_factory" "controlplane.main:app_factory" (eq $component "gateway") }}
            - --factory
            - --host=0.0.0.0
            - --port={{ $port }}
            - --no-access-log
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $port }}}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 8
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $name }}
            {{- if and (eq $component "api") $.Values.identity.existingSecret }}
            - secretRef:
                name: {{ $.Values.identity.existingSecret }}
            {{- end }}
          env:
            {{- include "controlplane.databaseEnv" (dict "root" $ "component" $component) | nindent 12 }}
            - name: MLP_POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: MLP_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: MLP_POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: MLP_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            {{- if eq $component "gateway" }}
            {{- if $go }}
            - name: CP_GATEWAY_IDLE_TIMEOUT
              value: {{ $settings.idleTimeout | default "60s" | quote }}
            {{- end }}
            - name: CP_GATEWAY_WORKERS
              value: {{ $settings.workers | default 12 | quote }}
            - name: CP_GATEWAY_DB_POOL_CAPACITY
              value: {{ $settings.dbPoolCapacity | default 15 | quote }}
            - name: CP_GATEWAY_OBSERVABILITY_PROFILE
              value: {{ $settings.observabilityProfile | default "normal" | quote }}
            {{- end }}
            {{- with $settings.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: {{ ternary "mlp-gateway" (printf "mlp-controlplane-%s" $component) (eq $component "gateway") }}
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          securityContext:
            {{- include "controlplane.containerSecurity" $ | nindent 12 }}
{{- end }}
