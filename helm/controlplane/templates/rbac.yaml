{{- $name := include "controlplane.name" . }}
{{- range $component := list "api" "gateway" "reconciler" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-{{ $component }}
automountServiceAccountToken: {{ ne $component "gateway" }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-api
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
---
# Bound only by RoleBindings in owned project namespaces; never a ClusterRoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-project-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete]
---
# Workload data-plane reads are bound only inside owned project namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-project-workload-reader
rules:
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get]
  - apiGroups: [serving.knative.dev]
    resources: [revisions]
    verbs: [get]
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-reconciler
rules:
  - apiGroups: [""]
    resources: [namespaces, serviceaccounts, resourcequotas, limitranges]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list] # reconciler checks whether a worker disk reservation can fit
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [{{ printf "%s-%s-project-secrets" .Release.Namespace $name | quote }}, {{ printf "%s-%s-project-workload-reader" .Release.Namespace $name | quote }}{{ if .Values.logStreaming.enabled }}, {{ printf "%s-%s-project-logs" .Release.Namespace $name | quote }}{{ end }}]
    verbs: [bind]
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch] # permits delegating these verbs to the workload Role
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [serving.knative.dev]
    resources: [revisions]
    verbs: [get]
{{- range $component := list "api" "reconciler" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Release.Namespace }}-{{ $name }}-{{ $component }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-{{ $component }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Namespace }}-{{ $name }}-{{ $component }}
{{- end }}

{{- if .Values.reconciler.leaderElection }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-leader
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ printf "%s-reconciler" $name | quote }}]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-reconciler
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-leader
{{- end }}
