apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "controlplane.name" . }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: mlp-controlplane-migrate
        app.kubernetes.io/part-of: ml-platform
    spec:
      # The pre-install hook uses no chart-owned SA/ConfigMap; they don't exist yet.
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- include "controlplane.podSecurity" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ if .Values.migrations.image.digest }}{{ printf "%s@%s" .Values.migrations.image.repository .Values.migrations.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.migrations.image.repository .Values.migrations.image.tag | quote }}{{ end }}
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          command: [python, -m, controlplane.persistence.migrate, upgrade]
          env:
            {{- include "controlplane.databaseEnv" (dict "root" . "component" "migration") | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- include "controlplane.containerSecurity" . | nindent 12 }}
