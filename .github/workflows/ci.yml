name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ml-platform-inference:ci .
      - name: container startup smoke test
        run: |
          # No MLflow in CI: the container must stay alive and report
          # /health 200 while /ready is 503. That is the contract Kubernetes
          # relies on to keep a model-less pod out of the Service.
          docker run -d --name svc \
            -e ML_MODEL_URI=models:/ml-platform-model/1 \
            -e ML_MLFLOW_TRACKING_URI=http://127.0.0.1:1 \
            -e ML_MODEL_LOAD_MAX_RETRIES=1 \
            -e ML_MODEL_LOAD_RETRY_SECONDS=0 \
            -p 8000:8000 ml-platform-inference:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health >/dev/null && break || sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ready)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8000/predict -H 'content-type: application/json' \
            -d '{"features":[1.0,2.0,3.0]}')" = "503"
          docker rm -f svc

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/ml-platform --values helm/ml-platform/values-local.yaml
      - name: render for every environment values file
        run: |
          for values in helm/ml-platform/values-*.yaml; do
            echo "--- $values"
            helm template inference helm/ml-platform --values "$values" >/dev/null
          done
      - name: irsa mode must not render a Secret
        run: |
          ! helm template inference helm/ml-platform \
            --set artifactStore.mode=irsa | grep -q 'kind: Secret'

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate every environment
        run: |
          for env in infra/terraform/environments/*/; do
            echo "--- $env"
            terraform -chdir="$env" init -backend=false -input=false
            terraform -chdir="$env" validate
          done
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - run: tflint --init
      - run: tflint --recursive --chdir=infra/terraform

      # No `terraform apply` and no `terraform plan` here on purpose: nothing
      # in CI holds AWS credentials, so nothing in CI can create billable
      # infrastructure. Adding plan means adding a read-only role first.

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: kubeconform — rendered manifests are valid Kubernetes
        run: |
          curl -sSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/kc.tar.gz kubeconform
          for chart in helm/ml-platform helm/platform-local; do
            vals=""
            [ -f "$chart/values-local.yaml" ] && vals="--values $chart/values-local.yaml"
            helm template x "$chart" $vals \
              | kubeconform -strict -summary -skip ServiceMonitor \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: build images
        run: |
          docker build -t ml-platform-inference:ci .
          docker build -t ml-platform-mlflow:ci docker/mlflow
          docker build -t ml-platform-training:ci -f docker/training/Dockerfile .
      - name: trivy — fail on FIXABLE HIGH/CRITICAL only
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ml-platform-inference:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: trivy — mlflow image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ml-platform-mlflow:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: trivy — training image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ml-platform-training:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: syft — SBOM for the inference image
        uses: anchore/sbom-action@v0
        with:
          image: ml-platform-inference:ci
          format: spdx-json
          artifact-name: inference-sbom.spdx.json
