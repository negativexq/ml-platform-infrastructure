# OpenTelemetry Collector (contrib): the one place the platform's telemetry arrives.
#
#   control-plane API / reconciler / inference ──OTLP/HTTP :4318──▶ collector
#       traces  ──▶ Tempo (OTLP/gRPC)
#       metrics ──▶ Prometheus exporter :8889  (scraped through a ServiceMonitor)
#
# Applications only know OTEL_EXPORTER_OTLP_ENDPOINT; swapping Tempo for another backend is a
# change to this file and nothing else.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch:
    timeout: 2s

exporters:
  otlp/tempo:
    endpoint: tempo.observability.svc.cluster.local:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # Resource attributes (service.name, ...) become labels: service_name="mlp-controlplane-api".
    resource_to_telemetry_conversion:
      enabled: true
    # A series that stops being reported (a dead reconciler) disappears after this long, which
    # is what lets "the heartbeat is gone" be alerted on.
    metric_expiration: 5m

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
