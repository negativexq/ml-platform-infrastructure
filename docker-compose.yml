name: ml-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    # Not published to the host: only MLflow needs it, over the compose network.
    # Inspect with `docker compose exec postgres psql -U mlflow`.
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the artifact bucket MLflow writes to.
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MLFLOW_BUCKET:-mlflow-artifacts} &&
      echo 'bucket ready'
      "

  mlflow:
    build:
      context: ./docker/mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      - --default-artifact-root=s3://${MLFLOW_BUCKET:-mlflow-artifacts}/
      # MLflow 3.x rejects unknown Host headers (DNS-rebinding protection).
      # Allow the in-network service name and the host-published port.
      - --allowed-hosts=${MLFLOW_ALLOWED_HOSTS:-mlflow:5000,mlflow,localhost:5001,localhost:5000,127.0.0.1:5001,host.docker.internal:5001}
    ports:
      # 5000 on the host is taken by macOS AirPlay Receiver; publish on 5001.
      - "${MLFLOW_HOST_PORT:-5001}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  inference:
    build:
      context: .
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      ML_MODEL_URI: ${ML_MODEL_URI:-models:/ml-platform-model/1}
      ML_MLFLOW_TRACKING_URI: http://mlflow:5000
      ML_MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${INFERENCE_HOST_PORT:-8000}:8000"

volumes:
  postgres-data:
  minio-data:
