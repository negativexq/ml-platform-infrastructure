[project]
name = "ml-platform-infra"
version = "0.1.0"
description = "Containerized inference service — ML platform infrastructure lab"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.5",
    "numpy>=2.1",
    "joblib>=1.4",
    "structlog>=24.4",
    "mlflow-skinny==3.16.0",
    "boto3>=1.35",
    # Required by mlflow's pyfunc loader, not pulled in by mlflow-skinny.
    "pandas>=2.2",
    # MLflow 3.x serialises sklearn models with skops.
    "skops>=0.10",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "requests>=2.32",
]
train = [
    "mlflow==3.16.0",
    "pandas>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "mlflow.*", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
norecursedirs = ["tests/integration"]
