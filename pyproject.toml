[project]
name = "ml-platform-infra"
version = "0.1.0"
description = "Containerized inference service — ML platform infrastructure lab"
requires-python = ">=3.12"
dependencies = [
    # 0.142 introduced native OpenTelemetry (`FastAPI(telemetry=...)`, `fastapi[opentelemetry]`).
    # The series is new: stay inside it until the API has settled. See constraints/ for the lock.
    "fastapi[opentelemetry]>=0.142,<0.143",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "mlflow-skinny==3.15.0",
]

[project.optional-dependencies]
inference = [
    "scikit-learn>=1.5",
    "numpy>=2.1",
    "joblib>=1.4",
    "boto3>=1.35",
    # Required by mlflow's pyfunc loader, not pulled in by mlflow-skinny.
    "pandas>=2.2",
    # MLflow 3.x serialises sklearn models with skops.
    "skops>=0.10",
    "prometheus-client>=0.21",
]
batch = ["pyarrow>=21,<26"]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "requests>=2.32",
]
controlplane = [
    "croniter>=6,<7",
    "jsonschema>=4.23,<5",
    # OTel SQLAlchemy instrumentation 0.66b0 supports SQLAlchemy <2.1.
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "kubernetes>=31",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    # OpenID Connect: verifying bearer and ID tokens (JWKS, RS256/ES256).
    "pyjwt[crypto]>=2.9",
    # The inference gateway forwards to serving with it (streamed, async).
    "httpx>=0.27",
]
controlplane-dev = [
    "pgserver>=0.1.4",
    "openapi-spec-validator>=0.7",
    "playwright>=1.48",
]
train = [
    "mlflow==3.15.0",
    "scikit-learn>=1.5",
    "numpy>=2.1",
    "boto3>=1.35",
    "pandas>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `find` rather than a fixed list: the inference image copies only app/, and a
# listed-but-absent package would break its `pip install .[inference]`.
[tool.setuptools.packages.find]
include = ["app*", "controlplane*", "batch_inference*"]
exclude = ["controlplane.tests*"]

[tool.setuptools.package-data]
controlplane = ["persistence/migrations/script.py.mako", "ui/static/*", "ui/static/*/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "mlflow.*", "boto3.*", "pgserver.*", "kubernetes.*", "croniter.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["tests/integration"]
