[project]
name = "ml-platform-infra"
version = "0.1.0"
description = "Containerized inference service — ML platform infrastructure lab"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.5",
    "numpy>=2.1",
    "joblib>=1.4",
    "structlog>=24.4",
    "mlflow-skinny==3.15.0",
    "boto3>=1.35",
    # Required by mlflow's pyfunc loader, not pulled in by mlflow-skinny.
    "pandas>=2.2",
    # MLflow 3.x serialises sklearn models with skops.
    "skops>=0.10",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "requests>=2.32",
]
controlplane = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "kubernetes>=31",
]
controlplane-dev = [
    "pgserver>=0.1.4",
    "openapi-spec-validator>=0.7",
]
train = [
    "mlflow==3.15.0",
    "pandas>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `find` rather than a fixed list: the inference image copies only app/, and a
# listed-but-absent package would break its `pip install .`.
[tool.setuptools.packages.find]
include = ["app*", "controlplane*"]
exclude = ["controlplane.tests*"]

[tool.setuptools.package-data]
controlplane = ["persistence/migrations/script.py.mako"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "mlflow.*", "boto3.*", "pgserver.*", "kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["tests/integration"]
